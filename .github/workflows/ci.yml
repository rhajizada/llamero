name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - "*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  env:
    name: Set versions
    runs-on: ubuntu-latest
    outputs:
      build_version: ${{ steps.env.outputs.build_version }}
      image_version: ${{ steps.env.outputs.image_version }}
      release: ${{ steps.env.outputs.release }}
    steps:
      - name: Determine versions
        id: env
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            image_version="${{ github.ref_name }}"
            build_version="${image_version#v}"
            release=true
          else
            image_version="${GITHUB_SHA::7}"
            build_version="${GITHUB_SHA::7}"
            release=false
          fi
          echo "build_version=$build_version" >> "$GITHUB_OUTPUT"
          echo "image_version=$image_version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  test:
    name: Lint and Test Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Lint with golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          args: --timeout 5m

      - name: Check code formatting
        run: golangci-lint fmt --diff

      - name: Static analysis
        run: go vet ./...

      - name: Validate Docker availability for integration tests
        run: docker info

      - name: Run tests
        if: ${{ !(github.ref == 'refs/heads/main' && github.event_name == 'push') }}
        run: go tool gotestsum --junitfile results/unit-tests.xml

      - name: Test Summary
        uses: test-summary/action@v2
        with:
          paths: "results/*.xml"
        if: ${{ always() && !(github.ref == 'refs/heads/main' && github.event_name == 'push') }}

      - name: Run coverage
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          docker info > /dev/null
          mapfile -t pkgs < <(go list ./... | grep -vE '^github.com/rhajizada/llamero/(docs$|internal/testutil$|ui($|/))')
          coverpkg="$(IFS=,; echo "${pkgs[*]}")"
          go tool gotestsum -- -coverpkg="$coverpkg" -coverprofile=coverage.out "${pkgs[@]}" > /dev/null
        shell: bash

      - name: Parse coverage
        id: coverage
        if: github.ref == 'refs/heads/main'
        run: |
          coverage="$(go tool cover -func=coverage.out | awk '/^total:/{print $3}')"
          coverage_value="${coverage%\%}"
          coverage_int="${coverage_value%.*}"
          if [ -z "$coverage_int" ]; then
            echo "Failed to parse coverage percentage." >&2
            exit 1
          fi
          case "$coverage_int" in
            100|9[5-9]) color="brightgreen" ;;
            8[0-9]|9[0-4]) color="green" ;;
            7[0-9]) color="yellowgreen" ;;
            5[0-9]|6[0-9]) color="yellow" ;;
            3[0-9]|4[0-9]) color="orange" ;;
            [0-9]|1[0-9]|2[0-9]) color="red" ;;
            *) color="red" ;;
          esac
          echo "coverage=$coverage" >> "$GITHUB_OUTPUT"
          echo "color=$color" >> "$GITHUB_OUTPUT"

      - name: Update badge
        if: github.ref == 'refs/heads/main'
        env:
          SIGNUM_BADGE_ID: ${{ vars.SIGNUM_BADGE_ID }}
          SIGNUM_BADGE_TOKEN: ${{ secrets.SIGNUM_BADGE_TOKEN }}
          COVERAGE: ${{ steps.coverage.outputs.coverage }}
          COLOR: ${{ steps.coverage.outputs.color }}
        run: |
          response="$(
            curl -sS -X PATCH \
              "https://signum.rhajizada.dev/api/badges/${SIGNUM_BADGE_ID}" \
              -H 'accept: application/json' \
              -H "Authorization: Bearer ${SIGNUM_BADGE_TOKEN}" \
              -H 'Content-Type: application/json' \
              -d "{\"color\":\"${COLOR}\",\"status\":\"${COVERAGE}\"}" \
              -w "\n%{http_code}"
          )"
          http_body="$(echo "$response" | sed '$d')"
          http_code="$(echo "$response" | tail -n 1)"
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "Badge update failed (${http_code}): ${http_body}" >&2
            exit 1
          fi

  eslint:
    name: Lint UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile
        working-directory: ui

      - name: Lint with eslint
        shell: bash
        run: bun run lint
        working-directory: ui

      - name: Run npm audit
        shell: bash
        run: bun audit
        working-directory: ui

  build-images:
    needs:
      - env
      - eslint
      - test
    name: Build ${{ matrix.app }} image
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - app: server
            file: ./docker/server/Dockerfile
            build_args: VERSION=${{ needs.env.outputs.build_version }}
          - app: worker
            file: ./docker/worker/Dockerfile
            build_args: VERSION=${{ needs.env.outputs.build_version }}
          - app: scheduler
            file: ./docker/scheduler/Dockerfile
            build_args: VERSION=${{ needs.env.outputs.build_version }}
          - app: ui
            file: ./docker/ui/Dockerfile
            build_args: NEXT_TELEMETRY_DISABLED=1

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Docker metadata (${{ matrix.app }})
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}/${{ matrix.app }}
          tags: |
            type=raw,value=${{ needs.env.outputs.image_version }}
            type=raw,value=latest,enable=${{ needs.env.outputs.release == 'true' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.env.outputs.image_version }}

      - name: Login to GHCR
        if: ${{ github.event_name == 'push' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          push: ${{ github.event_name == 'push' }}
          context: .
          file: ${{ matrix.file }}
          build-args: ${{ matrix.build_args || '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: true
